# This file is what makes the repo a monorepo.
#
# Without it, client/ and server/ are two unrelated npm projects that merely
# share a git history. With it, pnpm treats the repo as ONE dependency graph:
# a single lockfile at the root, a single node_modules store, and the ability
# to run a script across every package or depend on one package from another.
#
# Paths are globs relative to this file. Add 'packages/*' here on the day you
# extract code that both the client and the server need to share.
packages:
  - client
  - server
allowBuilds:
  '@parcel/watcher': set this to true or false
